# Word cap for AGENTS.md, and nothing else. Every word of it is in context on every turn of
# every session in this repo, so it holds only what every kind of task needs: what the repo
# is, the hard rules, the checks, the release steps and a read-next table. A rule that serves
# one kind of task lives on the page a row of that table points at.
#
# Split out of Lab.LengthDoc, whose 1200 words AGENTS.md had all but filled. Measured with
# vale's own `words` counter, the rebuilt file is 215 words. Three hundred is that plus about
# forty per cent of headroom, the same headroom Lab.LengthSkill took. Vale skips table text, so
# the cap limits prose and leaves the pointer rows free to grow.
#
# This is a dial, not a law. Raising it is a one-line diff here, made deliberately, with the
# reason in the commit message. Do not raise it because the file ran long: a rule one kind of
# task needs belongs behind a pointer, which is the seam this cap exists to keep open.
#
# `metric` rules are summary-scoped: the variables are computed over the whole file and
# the alert is reported at 1:1. The condition must be floating point — "> 300.0" and not
# "> 300", which vale does not parse.
extends: metric
message: "AGENTS.md is %s words; the cap is 300. Move the rule behind a read-next row."
level: error
formula: words
condition: "> 300.0"
