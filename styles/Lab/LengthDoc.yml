# Word cap for agent-facing documents: AGENTS.md, docs/agents/*, skills/*/SKILL.md. The
# companion rule for ADRs is Lab.LengthAdr, at 400. Not CONTEXT.md: a glossary only ever
# grows, so conformance caps it per entry instead and no file cap applies.
#
# This is a dial, not a law. Raising it is a one-line diff here, made deliberately, with
# the reason in the commit message. Do not raise it because a document ran long — that is
# the cap working.
#
# Raised 1000 -> 1200 when the repo gained its fourth skill: AGENTS.md has to name one more
# skill, its invocation rule and four more eval cases, and it was already at exactly 1000.
# One dial governs all three file classes above, so that raise also handed every SKILL.md
# 200 words it was not asked for. Nothing spends them today — the longest skill body is
# well under the old 1000 — and a skill body that starts creeping toward 1200 is a sign the
# detail belongs in `references/`, not that the cap is right. Split this rule before
# raising it again for AGENTS.md's sake alone.
#
# `metric` rules are summary-scoped: the variables are computed over the whole file and
# the alert is reported at 1:1. The condition must be floating point — "> 1200.0" and not
# "> 1200", which vale does not parse.
extends: metric
message: "This file is %s words; the cap is 1200. Cut it or split it."
level: error
formula: words
condition: "> 1200.0"
