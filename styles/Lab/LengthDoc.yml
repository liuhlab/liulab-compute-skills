# Word cap for agent-facing documents: docs/agents/*, upstream/README.md, and the pages behind
# a skill body under skills/*/. Skill bodies are NOT here — they carry Lab.LengthSkill, at 600
# — nor is AGENTS.md, which carries Lab.LengthAgents, at 300. The companion rule for ADRs is
# Lab.LengthAdr, at 400. Not GLOSSARY.md: a glossary only ever grows, so conformance caps it
# per entry instead and no file cap applies.
#
# This is a dial, not a law. Raising it is a one-line diff here, made deliberately, with
# the reason in the commit message. Do not raise it because a document ran long — that is
# the cap working.
#
# Raised 1000 -> 1200 once. It stays there because the densest lab-edison reference pages,
# the vendor facts behind that skill, sit just under it. Lab.LengthSkill and Lab.LengthAgents
# were split out of this rule so that a raise made for one class of file never hands words to
# another.
#
# `metric` rules are summary-scoped: the variables are computed over the whole file and
# the alert is reported at 1:1. The condition must be floating point — "> 1200.0" and not
# "> 1200", which vale does not parse.
extends: metric
message: "This file is %s words; the cap is 1200. Cut it or split it."
level: error
formula: words
condition: "> 1200.0"
