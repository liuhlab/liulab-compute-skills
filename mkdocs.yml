# The docs site. Built by zensical, which reads this file directly — there is no
# `zensical.toml`, so the config stays portable back to mkdocs if the alpha goes wrong.
# See `docs/adr/0005-docs-site-on-zensical.md`.
site_name: Liu Lab Compute Skills
site_description: Teach AI coding agents to use the Liu Lab HPC clusters safely
site_url: https://liuhlab.github.io/liulab-compute-skills/
repo_url: https://github.com/liuhlab/liulab-compute-skills
repo_name: liuhlab/liulab-compute-skills

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.footer

# The nav is EXPLICIT and lists only human-facing pages. Without it the navbar is built
# from the directory tree, which would put `docs/adr/` and `docs/agents/` straight into the
# menu. It does nothing about search — that is what the `search: exclude: true` front matter
# on those pages is for. Neither mechanism substitutes for the other, and `exclude_docs:` is
# silently ignored, so both are needed.
#
# `--strict` validates links and NOT the nav: an entry naming a missing file builds green
# and publishes a menu item that 404s, and no setting turns that back on. Conformance rule
# `nav-target-exists` is what has to catch it, which makes that rule load-bearing for the
# site rather than merely tidy. Add a human-facing page here when you write one; never add
# a page under `docs/adr/` or `docs/agents/`.
nav:
  - Home: index.md
  - Basic usage: usage.md
  - Skills:
      - lab-hpc: skills/lab-hpc.md
      - lab-jupyter: skills/lab-jupyter.md
      - lab-containers: skills/lab-containers.md

# `not_found:` and `anchors:` are zensical's defaults, spelled out because they are the two
# keys mkdocs also understands. The five under them are zensical's own and mkdocs rejects
# them, so a move back to mkdocs deletes this block as well as the pixi lines. Nothing here
# writes in a MkDocs key zensical drops in silence — `absolute_links:` and
# `unrecognized_links:` would look like gates and be none.
# `unresolved_references:` is left off on purpose: it reads any bracketed word in prose,
# `[draft]`, as a broken link reference and fails the build on it.
validation:
  links:
    not_found: warn
    anchors: warn
  unresolved_footnotes: true
  unused_definitions: true
  unused_footnotes: true
  shadowed_definitions: true
  shadowed_footnotes: true

# Explicit, because search is implicit under mkdocs and declared under this builder. No
# mkdocstrings: this repo ships no package.
plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - toc:
      permalink: true

# Google Analytics 4 — shared Liu Lab org property. The same tag is used
# across every liuhlab GitHub Pages site so traffic lands in one GA4
# property, separated by page path. gtag.js is GFW-blocked, so
# mainland-China readers are counted host-side (Tencent Cloud) instead.
extra:
  analytics:
    provider: google
    property: G-6M1CJF9WXY
