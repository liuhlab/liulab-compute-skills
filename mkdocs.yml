site_name: Liu Lab Compute Skills
site_description: Teach AI coding agents to use the Liu Lab HPC clusters safely
site_url: https://liuhlab.github.io/liulab-compute-skills/
repo_url: https://github.com/liuhlab/liulab-compute-skills
repo_name: liuhlab/liulab-compute-skills

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.footer

nav:
  - Home: index.md
  - Basic usage: usage.md
  - Skills:
      - lab-hpc: skills/lab-hpc.md
      - lab-jupyter: skills/lab-jupyter.md
      - lab-containers: skills/lab-containers.md

markdown_extensions:
  - admonition
  - tables
  - pymdownx.highlight
  - pymdownx.superfences
