# ============================== project ==============================
#
# This repo ships ONE package it never publishes: `src/edison_cli`, the Edison spend path.
# Everything else here is a Claude Code plugin marketplace of Agent Skills — Markdown and
# bash — and nothing is ever uploaded to a package index, so the name stays an identifier
# rather than a claim on one. The package exists so that `ruff` and `pyright` can read the
# code that spends a lab member's credits; see `docs/adr/0011`.
#
# It was the lab template's `no-package` shape until 2026-09: no `[project.scripts]`, no
# wheel target, no pytest config. All three are here now, for that one package.

[project]
name = "liulab-compute-skills"
description = "Liu Lab Agent Skills for HPC, containers and remote compute, packaged as a Claude Code plugin."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
authors = [{ name = "Liu Lab" }]
# hatch-vcs reads the newest git tag. Never add a `version` key.
dynamic = ["version"]
# The Edison platform client, and one floor on a package it does not name.
#
# Neither floor is cosmetic. Below 0.16 the resolver reaches releases whose `litellm` pin
# drags the rest of the stack somewhere `import edison_client` raises, and 0.16.x is also
# the version every fact in `skills/lab-edison/references/` was read from. `fhlmi` is worse,
# because nothing in the chain declares it: `edison-client` asks for `ldp`, `ldp` 1.x
# imports `lmi.config`, and `lmi.config` arrived in `fhlmi` 1.0 — so a solve free to pick
# `fhlmi` 0.4x installs cleanly, reports the right `edison-client` version, and raises
# `ModuleNotFoundError` on the first import. Both floors turn that into a lock-time failure
# instead of a runtime one. Re-check them whenever `edison-client` moves.
# typer is the command line itself. It brings `click`, which is the package that broke this
# environment once: zensical's conda build of it used to pin the shared solve tight enough to
# exclude every usable `edison-client`. It cannot do that any more — `docs` solves on its own
# now — and the default environment takes click from PyPI, where the two agree.
dependencies = ["edison-client>=0.16", "fhlmi>=1.0", "typer>=0.12"]

# The one console script. `pixi run edison-cli ...` from the plugin root is how the skill
# reaches it, and `--manifest-path` makes that work from any working directory.
[project.scripts]
edison-cli = "edison_cli.__main__:main"

# ============================== build ==============================

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# `fallback-version` IS a hand-written version string, and it is here on purpose. An
# installed plugin is a plain copy of this tree under `~/.claude/plugins/cache/` with no
# `.git`, so `source = "vcs"` cannot resolve a version there and `pixi install` dies before
# the skill can run. `0.0.0` is the honest value: this package is never published and
# nothing reads its version. The plugin's own version lives in `.claude-plugin/plugin.json`.
[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

# No directory here is named after the project, so the wheel target has to name the package
# explicitly or the build finds nothing to package.
[tool.hatch.build.targets.wheel]
packages = ["src/edison_cli"]

# ============================== pixi ==============================

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

# The interpreter. `requires-python` above is the floor this pin satisfies.
#
# ruff and pyright cover this repo's Python, which is `skills/install.py` today and the
# conformance checker next, both copied from the template, where they already pass these
# gates. A step that runs over an empty set costs a second; a step nobody adds costs the
# first Python file.
[tool.pixi.dependencies]
python = "3.13.*"
ruff = "*"
# Exact: Pylance is pyright, so the editor and CI must give one verdict.
pyright = "==1.1.411"
# The writing gates. Exact on vale: the jargon map and the grade-11 cap in `styles/Lab/`
# were measured against this version, so a floating pin would move the verdict without
# anyone editing a rule.
vale = "3.19.0.*"
markdownlint-cli2 = "*"
# The one gate that reads this repo's actual executable surface. Everything that runs here
# is bash — the three test suites, the gate runner and the skill's config check — so
# without this the linters above would all be checking an empty set.
shellcheck = "*"
# For conformance, which parses `mkdocs.yml` and the workflows and runs in `default`. Not on
# the `docs` feature: the checker reads the site configuration, it does not build the site.
pyyaml = "*"

# The package itself, editable, so `pyright` and `pytest` read the working tree rather than
# a copy — and so `edison-cli` lands on the environment's PATH. This is what pulls
# `edison-client` in through `[project.dependencies]` above.
#
# pytest is HERE and not in `[tool.pixi.dependencies]`, which is where a test runner would
# normally go. conda-forge's pytest drags conda builds of `packaging` and its friends into
# the shared solve, and those pin the PyPI side hard enough to drop `fhlmi` to 0.43 — which
# leaves `edison-client` 0.16 installed and `import edison_client` raising
# `No module named 'lmi.config'`. Measured, not guessed. Resolved by uv alongside the client,
# it agrees with the client instead of fighting it.
[tool.pixi.pypi-dependencies]
liulab-compute-skills = { path = ".", editable = true }
pytest = "*"

# The docs builder, in a feature of its own so that exactly one CI job installs it and the
# gate everyone runs does not carry it.
#
# Exact, and bumped in a commit of its own: at `0.0.x` nothing promises the next patch is
# compatible, and a patch release has already broken search once. Re-run `pixi run docs-build`
# when you move it. See `docs/adr/0005-docs-site-on-zensical.md`.
#
# No mkdocstrings handler: this repo ships no package, so there is no API to render.
[tool.pixi.feature.docs.dependencies]
zensical = "==0.0.57"

# On the feature, so these resolve in the `docs` environment with no `-e` flag.
# `serve` ignores `--strict` and says so, hence its absence.
[tool.pixi.feature.docs.tasks]
docs = "zensical serve"
docs-build = "zensical build --clean --strict"

# `default` deliberately does NOT take `docs`: the docs feature exists so that one CI job,
# and one laptop command, installs the builder and nothing else pays for it.
#
# `docs` takes `no-default-feature` and leaves the solve group, and both halves are
# load-bearing — each alone still fails. zensical's conda dependencies put `click` and
# `importlib-metadata` into whatever solve they share, and those two exclude every
# `edison-client` at or above 0.12. Sharing the group poisons `default`; keeping the
# default feature makes `docs` itself resolve `edison-client` and fail there instead. So
# the two environments now solve independently, and `docs` loses ruff, pyright, vale and
# shellcheck, none of which `docs-build` calls.
[tool.pixi.environments]
default = { solve-group = "default" }
docs = { features = ["docs"], no-default-feature = true }

[tool.pixi.tasks]
lint = "ruff check ."
fmt = "ruff format ."
fmt-check = "ruff format --check ."
typecheck = "pyright"
# The repo's own bash suite. NOT named `lint` — that name is ruff's in every lab repo, and
# a shared name meaning two different things is the collision this rule exists to stop.
# Layer 1 only: `tests/preflight.sh` reads a real `~/.ssh/config` and `tests/eval.sh`
# spends API tokens on headless agent sessions, so neither belongs on a pull request.
skill-lint = "bash tests/lint.sh"
# vale reads language, markdownlint reads structure. `.`, never an absolute path: an
# absolute path matches no `.vale.ini` section and exits 0 having checked nothing. The glob
# keeps vale out of trees it never lints — `check.sh` runs the steps concurrently, and a
# walk of `.pixi/` races whatever else is writing there.
vale = "vale --glob='!{.pixi,site,dist,build}/**' ."
# No glob here: `.markdownlint-cli2.yaml` carries both the file set and `gitignore: true`.
markdownlint = "markdownlint-cli2"
# `git ls-files`, not a hand-written glob: the file set is then "every tracked script",
# so a script added in a directory nobody thought of is checked rather than skipped.
# Default severity — a finding this repo disagrees with is silenced at its line with a
# `shellcheck disable` directive saying why, never by turning a whole class off here.
shellcheck = "shellcheck $(git ls-files '*.sh')"
# The structural gate: the conventions a lab repo keeps after it leaves the template, read
# off `[tool.liulab.agent-docs]` and `[tool.liulab.waived]` at the foot of this file. The
# script is a verbatim copy of the template's — never edit it here; a rule this repo cannot
# meet is answered with a waiver, not a patch.
conformance = "python scripts/conformance.py"
# The unit tests, all of `src/edison_cli` and none of the network. Every test that would
# otherwise reach the Edison platform is answered by a stub the test writes itself, so the
# suite is safe on the day the spend path is broken — which is the day it matters.
test = "pytest"
# The static step list lives here and nowhere else; `check.sh` takes it as arguments, and
# `ci.yml` invokes this task by name, so the local gate and CI cannot drift.
check-static = "bash scripts/check.sh lint fmt-check typecheck test vale markdownlint shellcheck conformance"
check = { depends-on = ["check-static", "skill-lint"] }

# ============================== pytest ==============================

# `src/edison_cli` is the only Python here a unit test can say anything about, and every one
# of its tests answers from a stub. Nothing in `tests/` may reach the platform.
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

# ============================== ruff ==============================

[tool.ruff]
line-length = 100
src = ["scripts", "skills", "src"]
# No `target-version`: ruff infers it from `requires-python`.
extend-exclude = [".pixi", "site", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "PT",  # flake8-pytest-style
    "PTH", # flake8-use-pathlib
    "N",   # pep8-naming
    "D",   # pydocstyle (numpy convention, configured below)
    "RUF", # ruff-specific
]
# E501: the formatter owns line length. D203/D213: incompatible with D211/D212.
ignore = ["E501", "D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

# ============================== pyright ==============================

[tool.pyright]
# The three directories where this repo's Python lives. `src` is the point of the exercise:
# without it the one package here — the code that spends credits — would be typechecked by
# nothing, which is the defect `docs/adr/0011` exists to close. `tests` is deliberately
# absent: its stub defines a second `edison_client`, and pyright reading both would report
# the real client's own surface as a redeclaration.
include = ["scripts", "skills", "src"]
exclude = ["**/__pycache__", "**/.pixi"]
venvPath = ".pixi/envs"
venv = "default"
# No `pythonVersion`: taken from the interpreter in the environment above.
typeCheckingMode = "standard"
# Not redundant: `standard` does not check that a parameter is annotated at all. `Any`
# satisfies it, so the fix is always in the file you are editing.
reportMissingParameterType = "error"
# Deliberately NOT `reportUnknownParameterType`: it also fails annotated parameters and
# inferred return types whose types an untyped dependency owns. Not a bar a lab repo can meet.
useLibraryCodeForTypes = true
reportMissingTypeStubs = "none"

# ============================== liulab ==============================
# Read by `scripts/conformance.py`; its docstring has the rules.

# The agent-facing files, and the Vale Length rule that caps each. A key does two jobs, and
# the two read it differently. Conformance rule 2 resolves it against `git ls-files` as a
# plain path prefix — a trailing `/` matches a directory, any other key matches that one
# path — and reads only the keys under the site source, so the `skills/` keys never reach
# it. Conformance rule 3 looks for the key verbatim INSIDE a `.vale.ini` section header, and
# there a glob is what pairs. The two `skills/` keys below are globs for that reason.
#
# Every key must appear verbatim in exactly one `.vale.ini` section header — a key in zero
# sections is checked by nothing, and a key in two cannot be paired. That is why there is no
# plain `skills/` key: it is a substring of the references header AND of the skill-body
# header, so it would match twice and fail. Skill bodies carry LengthSkill at 600; the
# reference pages keep LengthDoc, a glob wider than the lab template's `skills/*/SKILL.md`
# so that the per-cluster and per-platform pages are capped at all.
#
# `docs/research/` is absent because this repo has no research notes; declaring a key for a
# directory nobody wrote would fail rule 3 on the section that has no key to pair with.
[tool.liulab.agent-docs]
"AGENTS.md" = "LengthDoc"
"CONTEXT.md" = false                   # capped per entry by conformance rule 4, not per file
"docs/agents/" = "LengthDoc"
"skills/*/references/" = "LengthDoc"
"skills/*/SKILL.md" = "LengthSkill"
"docs/adr/" = "LengthAdr"

# Conformance rules this repo does not meet on purpose. Keyed by rule name, value the
# reason. Per-rule, never per-file; no expiry; printed on every conformance run, so the
# reason has to read well to someone who has never seen the issue that added it.
# `placeholder-rename` refuses to be waived.
[tool.liulab.waived]
skill-name-prefix = """The rule stops a repo-local skill from shadowing the lab's shared \
`lab-compute` plugin: both are discovered the same way, so a directory named `lab-*` in \
someone's working repo silently wins over the plugin's copy of that skill for everyone \
who opens it. This repo IS that plugin — every `skills/lab-*` directory here is the \
original every other repo is being protected from shadowing — so the rule fires once per \
skill on the one tree where the prefix is the correct name. Waived here and nowhere \
else."""
skill-symlinks = """These skills also ship as a Claude Code plugin, so a committed \
project-local symlink would load every one of them twice for anyone who opens this repo \
as their working directory with the plugin installed. Nothing is linked into the tree, \
and the documented install is user-level: `python skills/install.py --target all --user`."""
