# Rules live in styles/Lab/, tracked — so `styles/` is not in .gitignore.
#
# EVERY RULE IS NAMED IN EVERY SECTION. Vale's `*` matches `/`, so sections overlap and
# per-rule settings accumulate, later sections winning. An omitted rule keeps whatever an
# earlier section said, which once left ADRs checked by nothing on green CI. Broad section
# first. Each [tool.liulab.agent-docs] key appears verbatim in one header below; conformance
# rule 3 pairs them by substring. The caps are explained in docs/agents/writing.md.

StylesPath = styles
MinAlertLevel = error

# 1. Human-facing: the published site. Uncapped.
[{README.md,CHANGELOG.md,docs/**/*.md}]
BasedOnStyles = Lab
Lab.Jargon = YES
Lab.Readability = YES
Lab.LengthDoc = NO
Lab.LengthSkill = NO
Lab.LengthAdr = NO

# 2. Agent-facing prose: word budget only. CONTEXT.md is not here — see section 6.
#
# The skills half is the reference pages, `skills/*/references/**/*.md`: this repo's densest
# agent-facing prose, and the lab template's `skills/*/SKILL.md` does not reach them at all.
# Skill bodies are NOT here — they have a tighter cap of their own in section 3. The two
# globs are disjoint, so neither section overrides the other, and there is deliberately no
# `skills/` key any more: that string is a substring of both headers, and conformance rule 3
# requires exactly one.
[{AGENTS.md,docs/agents/**/*.md,skills/*/references/**/*.md}]
BasedOnStyles = Lab
Lab.Jargon = NO
Lab.Readability = NO
Lab.LengthDoc = YES
Lab.LengthSkill = NO
Lab.LengthAdr = NO

# 3. Skill bodies: their own cap, below the document one. A body is an interface — what must
# be true before the first tool call — and the procedures behind it live in references/,
# which section 2 caps instead.
[skills/*/SKILL.md]
BasedOnStyles = Lab
Lab.Jargon = NO
Lab.Readability = NO
Lab.LengthDoc = NO
Lab.LengthSkill = YES
Lab.LengthAdr = NO

# 4. Decision records: the tighter cap.
[docs/adr/**/*.md]
BasedOnStyles = Lab
Lab.Jargon = NO
Lab.Readability = NO
Lab.LengthDoc = NO
Lab.LengthSkill = NO
Lab.LengthAdr = YES

# 5. Research notes: uncapped, and exempt from jargon because a note quotes what it argues
# against — the note defining the jargon map lists every banned phrase as evidence.
[docs/research/**/*.md]
BasedOnStyles = Lab
Lab.Jargon = NO
Lab.Readability = NO
Lab.LengthDoc = NO
Lab.LengthSkill = NO
Lab.LengthAdr = NO

# 6. The glossary: no file cap. It grows one term at a time and never shrinks, so a file-level
# word count measures the size of the domain, not the quality of the writing. Conformance caps
# each entry at 200 words instead — the unit that matches how the file grows. Last because it
# is the narrowest pattern here, and the later section wins.
[CONTEXT.md]
BasedOnStyles = Lab
Lab.Jargon = NO
Lab.Readability = NO
Lab.LengthDoc = NO
Lab.LengthSkill = NO
Lab.LengthAdr = NO
